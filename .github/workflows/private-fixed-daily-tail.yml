name: Private Fixed Daily Tail

on:
  workflow_dispatch:
    inputs:
      expected_compute_sha:
        description: Exact reviewed public Compute main commit
        required: true
        type: string
      expected_receipt_commitment:
        description: Opaque salted commitment to the exact private receipt
        required: true
        type: string

permissions:
  contents: read

jobs:
  append:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'yuatom/stock-market-data' && github.ref == 'refs/heads/main' && github.actor == 'yuatom' && github.triggering_actor == 'yuatom' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: market-data-collector
      cancel-in-progress: false
      queue: max
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate exact manual source identity
        shell: python
        env:
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_RECEIPT_COMMITMENT: ${{ inputs.expected_receipt_commitment }}
        run: |
          import os
          import re
          expected = os.environ.get('EXPECTED_COMPUTE_SHA', '')
          commitment = os.environ.get('EXPECTED_RECEIPT_COMMITMENT', '')
          guards = dict(GITHUB_ACTIONS='true', GITHUB_EVENT_NAME='workflow_dispatch',
                        GITHUB_REPOSITORY='yuatom/stock-market-data', GITHUB_REPOSITORY_OWNER='yuatom',
                        GITHUB_REF='refs/heads/main', GITHUB_SHA=expected, GITHUB_ACTOR='yuatom',
                        GITHUB_TRIGGERING_ACTOR='yuatom', GITHUB_RUN_ATTEMPT='1',
                        GITHUB_WORKFLOW_REF='yuatom/stock-market-data/.github/workflows/private-fixed-daily-tail.yml@refs/heads/main',
                        GITHUB_WORKFLOW_SHA=expected)
          if (not re.fullmatch('[0-9a-f]{40}', expected)
              or not re.fullmatch('[0-9a-f]{64}', commitment)
              or not re.fullmatch('[1-9][0-9]{0,19}', os.environ.get('GITHUB_RUN_ID', ''))
              or any(os.environ.get(name) != value for name, value in guards.items())):
              raise SystemExit('PRIVATE_FIXED_TAIL_INVALID_DISPATCH')
      - name: Checkout exact reviewed Compute source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: compute
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run private fixed-tail route
        working-directory: compute
        env:
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_RECEIPT_COMMITMENT: ${{ inputs.expected_receipt_commitment }}
          MARKET_DATA_STORE_TOKEN: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -B -m scripts.run_private_fixed_tail_20261120 --compute-sha "$EXPECTED_COMPUTE_SHA" --receipt-commitment "$EXPECTED_RECEIPT_COMMITMENT"
