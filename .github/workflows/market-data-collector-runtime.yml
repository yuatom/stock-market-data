name: Market Data Collector Runtime

on:
  workflow_call:
    inputs:
      trigger_kind:
        description: Logical trigger kind: push, workflow_dispatch, or schedule
        required: true
        type: string
      control_ref:
        description: Immutable control-branch request commit for push invocations
        required: false
        default: ''
        type: string
      control_branch:
        description: Logical control branch for push invocations
        required: false
        default: ''
        type: string
      schedule:
        description: Schedule expression for scheduled invocations
        required: false
        default: ''
        type: string
      mode:
        description: Manual workflow_dispatch mode
        required: false
        default: ''
        type: string
      trade_date:
        description: Optional manual ET trade/calendar date
        required: false
        default: ''
        type: string
    secrets:
      MARKET_DATA_STORE_TOKEN:
        required: true
      TWELVE_DATA_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: market-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable control request
        if: inputs.trigger_kind == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_ref }}
          fetch-depth: 1
          path: control

      - name: Checkout current public compute contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: compute

      - name: Checkout private Market Data Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: main
          fetch-depth: 0
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Resolve and validate collector invocation
        id: invocation
        shell: python
        env:
          EVENT_NAME: ${{ inputs.trigger_kind }}
          EVENT_SCHEDULE: ${{ inputs.schedule }}
          EVENT_BRANCH: ${{ inputs.control_branch }}
          CONTROL_REF: ${{ inputs.control_ref }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          et = ZoneInfo('America/New_York')
          event = os.environ.get('EVENT_NAME', '')
          branch = os.environ.get('EVENT_BRANCH', '')
          control_ref = os.environ.get('CONTROL_REF', '')
          compute_sha = subprocess.check_output(
              ['git', '-C', 'compute', 'rev-parse', 'HEAD'], text=True
          ).strip()
          mode = ''
          trade_date = ''
          request_id = ''
          maintenance_authorized = False

          schedules = {
              '5 7 * * 1-5': 'previous_session_eod',
              '20 7 * * 1-5': 'nasdaq_extended_probe',
              '46 9 * * 1-5': 'open_15m',
              '1 10 * * 1-5': 'open_30m',
              '31 10 * * 1-5': 'open_60m',
              '6 16 * * 1-5': 'close',
              '21 16 * * 1-5': 'close_retry',
              '36 16 * * 1-5': 'close_retry',
              '45 16 * * 1-5': 'nasdaq_extended_probe',
              '51 16 * * 1-5': 'close_final',
          }
          manual_modes = {
              'smoke_readonly', 'previous_session_eod', 'daily_baseline_init',
              'daily_baseline_rebase', 'nasdaq_extended_probe', 'open_15m',
              'open_30m', 'open_60m', 'close', 'close_retry', 'close_final',
              'historical_context_repair',
          }

          if event == 'push' and branch == 'collector-requests':
              if not re.fullmatch(r'[0-9a-f]{40}', control_ref):
                  raise SystemExit('collector request control_ref must be an immutable commit SHA')
              path = Path('control/requests/collector-request.json')
              request = json.loads(path.read_text(encoding='utf-8'))
              required = {
                  'schema_version','request_id','requested_at','trade_date','stage','mode',
                  'research_repository','research_repository_commit_sha','market_data_contract_sha'
              }
              missing = sorted(required - set(request))
              if missing:
                  raise SystemExit(f'collector request missing fields: {missing}')
              if request.get('schema_version') != 1:
                  raise SystemExit('collector request schema_version must be 1')
              if request.get('research_repository') != 'yuatom/stock-dairy':
                  raise SystemExit('collector request research_repository is unauthorized')
              if request.get('mode') not in {'open_15m','open_30m','open_60m','close'}:
                  raise SystemExit('collector request mode is not a live-stage mode')
              if request.get('stage') != request.get('mode'):
                  raise SystemExit('collector request stage must equal mode')
              for field in ('research_repository_commit_sha','market_data_contract_sha'):
                  value = str(request.get(field) or '')
                  if not re.fullmatch(r'[0-9a-f]{40}', value):
                      raise SystemExit(f'collector request {field} is invalid')
              if request.get('market_data_contract_sha') != compute_sha:
                  raise SystemExit(
                      'collector request market_data_contract_sha does not match current compute main'
                  )
              current_et_date = datetime.now(et).date().isoformat()
              if request.get('trade_date') != current_et_date:
                  raise SystemExit(
                      f"collector request trade_date {request.get('trade_date')} != current ET date {current_et_date}"
                  )
              mode = str(request['mode'])
              trade_date = str(request['trade_date'])
              request_id = str(request['request_id'])
          elif event == 'push' and branch == 'maintenance-requests':
              if not re.fullmatch(r'[0-9a-f]{40}', control_ref):
                  raise SystemExit('maintenance request control_ref must be an immutable commit SHA')
              path = Path('control/requests/market-data-maintenance.json')
              request = json.loads(path.read_text(encoding='utf-8'))
              required = {
                  'schema_version','request_id','requested_at','trade_date','mode','scope',
                  'authority','market_data_contract_sha'
              }
              missing = sorted(required - set(request))
              if missing:
                  raise SystemExit(f'maintenance request missing fields: {missing}')
              if request.get('schema_version') != 1:
                  raise SystemExit('maintenance request schema_version must be 1')
              if request.get('authority') != 'owner_authorized_data_plane_maintenance':
                  raise SystemExit('maintenance request authority is unauthorized')
              expected_scope = {
                  'daily_baseline_init': 'collection_universe_daily_baseline',
                  'historical_context_repair': 'cutoff_valid_cross_asset_context_proxies_only',
              }
              requested_mode = str(request.get('mode') or '')
              if requested_mode not in expected_scope:
                  raise SystemExit('maintenance request mode is unauthorized')
              if request.get('scope') != expected_scope[requested_mode]:
                  raise SystemExit('maintenance request mode/scope mismatch')
              contract_sha = str(request.get('market_data_contract_sha') or '')
              if not re.fullmatch(r'[0-9a-f]{40}', contract_sha):
                  raise SystemExit('maintenance request market_data_contract_sha is invalid')
              if contract_sha != compute_sha:
                  raise SystemExit('maintenance request contract SHA does not match current compute main')
              requested_trade_date = str(request.get('trade_date') or '')
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', requested_trade_date):
                  raise SystemExit('maintenance request trade_date is invalid')
              if requested_trade_date > datetime.now(et).date().isoformat():
                  raise SystemExit('maintenance request trade_date cannot be in the future')
              mode = requested_mode
              trade_date = requested_trade_date
              request_id = str(request['request_id'])
              maintenance_authorized = True
          elif event == 'workflow_dispatch':
              mode = os.environ.get('MANUAL_MODE', '')
              trade_date = os.environ.get('MANUAL_TRADE_DATE', '')
              if mode not in manual_modes:
                  raise SystemExit(f'unauthorized manual mode: {mode}')
              maintenance_authorized = mode == 'historical_context_repair'
          elif event == 'schedule':
              mode = schedules.get(os.environ.get('EVENT_SCHEDULE', ''), '')
              if not mode:
                  raise SystemExit('unknown collector schedule')
          else:
              raise SystemExit(f'unsupported logical trigger: {event}/{branch}')

          if not trade_date:
              trade_date = datetime.now(et).date().isoformat()
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', trade_date):
              raise SystemExit(f'invalid trade_date: {trade_date}')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              fh.write(f'mode={mode}\n')
              fh.write(f'trade_date={trade_date}\n')
              fh.write(f'request_id={request_id}\n')
              fh.write(f'market_data_contract_sha={compute_sha}\n')
              fh.write(f"maintenance_authorized={'true' if maintenance_authorized else 'false'}\n")
          print(json.dumps({
              'logical_trigger': event,
              'control_branch': branch or None,
              'control_ref': control_ref or None,
              'mode': mode,
              'trade_date': trade_date,
              'request_id': request_id or None,
              'market_data_contract_sha': compute_sha,
              'maintenance_authorized': maintenance_authorized,
          }, sort_keys=True))

      - name: Verify required secrets
        env:
          STORE_TOKEN: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MODE: ${{ steps.invocation.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ -z "$STORE_TOKEN" ]]; then
            echo 'MARKET_DATA_STORE_TOKEN is not configured' >&2
            exit 1
          fi
          case "$MODE" in
            smoke_readonly|nasdaq_extended_probe) ;;
            *)
              if [[ -z "$TWELVE_KEY" ]]; then
                echo 'TWELVE_DATA_API_KEY is not configured' >&2
                exit 1
              fi
              ;;
          esac

      - name: Read-only private Store smoke
        if: steps.invocation.outputs.mode == 'smoke_readonly'
        working-directory: compute
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_market_data_inventory.py \
            --store-root ../store/data/market-data \
            --output /tmp/market-data-inventory.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          import collection_universe as collection

          inv = json.loads(Path('/tmp/market-data-inventory.json').read_text())
          universe = collection.load_collection_universe('config/collection-universe.json')
          expected = {symbol for symbol, _asset in collection.daily_universe(universe)}
          context = set(collection.context_symbols(universe))
          rows = inv['daily_series_summary']['series']
          twelve = [r for r in rows if r.get('provider') == 'twelve_data_basic']
          by_symbol = {r['symbol']: r for r in twelve}
          unknown = sorted(set(by_symbol) - expected)
          assert not unknown, unknown
          legacy_required = expected - context
          assert legacy_required.issubset(by_symbol), sorted(legacy_required - set(by_symbol))
          for symbol, row in by_symbol.items():
              if symbol == 'SPCX':
                  assert row['identity_effective_from'] == '2026-06-12'
                  assert int(row['record_count']) >= 44
                  assert row['first_trade_date'] >= '2026-06-12'
              elif symbol not in context:
                  assert int(row['record_count']) >= 256
          assert inv['session_capture_summary']
          assert inv['stage_snapshot_summary']
          assert Path('../store/data/market-data/collector-state/migration-source-audit.json').exists()
          print(json.dumps({
              'status': 'pass',
              'twelve_series': len(twelve),
              'context_baseline_pending': sorted(context - set(by_symbol)),
              'session_groups': len(inv['session_capture_summary']),
              'stage_snapshots': len(inv['stage_snapshot_summary']),
              'spcx_records': by_symbol['SPCX']['record_count'],
          }, sort_keys=True))
          PY

      - name: Collect qualified facts into private Store checkout
        if: steps.invocation.outputs.mode != 'smoke_readonly'
        working-directory: compute
        shell: bash
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          MODE: ${{ steps.invocation.outputs.mode }}
          TRADE_DATE: ${{ steps.invocation.outputs.trade_date }}
          MAINTENANCE_AUTHORIZED: ${{ steps.invocation.outputs.maintenance_authorized }}
        run: |
          set -euo pipefail
          store_root='../store/data/market-data'
          universe_common=(
            --store-root "$store_root"
            --universe config/collection-universe.json
          )
          if [[ "$MODE" == 'nasdaq_extended_probe' ]]; then
            python scripts/probe_nasdaq_extended.py \
              --config config/market-data-collector-access.yaml \
              --store-root "$store_root" --session auto > /tmp/collector-output.txt 2>/tmp/collector-error.txt
          elif [[ "$MODE" == 'daily_baseline_init' ]]; then
            python scripts/initialize_market_data_baseline.py \
              --trade-date "$TRADE_DATE" \
              "${universe_common[@]}" \
              --store-config config/market-data-store.yaml \
              --access-config config/market-data-collector-access.yaml > /tmp/collector-output.txt 2>/tmp/collector-error.txt
          elif [[ "$MODE" == 'daily_baseline_rebase' ]]; then
            python scripts/rebase_market_data_baseline.py \
              --trade-date "$TRADE_DATE" \
              "${universe_common[@]}" \
              --store-config config/market-data-store.yaml \
              --access-config config/market-data-collector-access.yaml > /tmp/collector-output.txt 2>/tmp/collector-error.txt
          else
            extra=()
            if [[ "$MODE" == 'historical_context_repair' ]]; then
              if [[ "$MAINTENANCE_AUTHORIZED" != 'true' ]]; then
                echo 'historical_context_repair lacks maintenance authorization' >&2
                exit 1
              fi
              extra+=(--maintenance-authorized)
            fi
            python scripts/collect_market_data.py \
              --mode "$MODE" --trade-date "$TRADE_DATE" \
              "${universe_common[@]}" \
              --config config/market-data-store.yaml \
              --access-config config/market-data-collector-access.yaml \
              "${extra[@]}" > /tmp/collector-output.txt 2>/tmp/collector-error.txt
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path('/tmp/collector-output.txt').read_text(errors='replace').splitlines()
          result = None
          for line in reversed(lines):
              try:
                  value = json.loads(line)
              except Exception:
                  continue
              if isinstance(value, dict):
                  result = value
                  break
          if result is None:
              result = {'status': 'completed_without_parseable_summary'}
          allowed = {
              'mode','status','changed','changed_series','bootstrapped_series','symbols_requested',
              'symbols_requested_in_increment','symbols_available_in_increment','symbols_missing_in_increment',
              'snapshot_written','target_records','request_id','path','result_count','target_count',
              'application_success_json','trade_detail_rows','repair_scope','context_categories_requested'
          }
          safe = {k: result[k] for k in sorted(result) if k in allowed}
          if isinstance(result.get('failures'), list):
              safe['failure_count'] = len(result['failures'])
              safe['failure_classes'] = sorted({
                  str(x.get('reason') or 'unknown') for x in result['failures'] if isinstance(x, dict)
              })[:12]
          elif isinstance(result.get('failures'), dict):
              safe['failure_count'] = len(result['failures'])
          if isinstance(result.get('missing'), list):
              safe['missing_count'] = len(result['missing'])
          if isinstance(result.get('snapshot_missing'), list):
              safe['snapshot_missing_count'] = len(result['snapshot_missing'])
          print(json.dumps(safe, sort_keys=True))
          PY

      - name: Rebuild private Store inventory
        if: steps.invocation.outputs.mode != 'smoke_readonly'
        working-directory: compute
        run: >-
          python scripts/build_market_data_inventory.py
          --store-root ../store/data/market-data
          --output ../store/data/market-data/collector-state/market-data-inventory.json
          >/dev/null

      - name: Persist private Store only
        if: steps.invocation.outputs.mode != 'smoke_readonly'
        working-directory: store
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/market-data
          if git diff --cached --quiet; then
            echo '{"status":"no_store_change","changed_paths":0}'
            exit 0
          fi
          changed_count="$(git diff --cached --name-only -- data/market-data | wc -l | tr -d ' ')"
          git config user.name 'stock-market-data-bot'
          git config user.email 'stock-market-data-bot@users.noreply.github.com'
          git commit -m "data: collect ${{ steps.invocation.outputs.mode }} qualified market facts"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "{\"status\":\"store_persisted\",\"changed_paths\":$changed_count,\"store_commit_sha\":\"$(git rev-parse HEAD)\"}"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
