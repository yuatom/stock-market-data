name: Bootstrap Market Data Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/bootstrap-runtime-activation-v1
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact stock-dairy source SHA
        required: false
        default: 150a9bd07def8b9fb159ef92b3a1c8b5ff91195e
        type: string

permissions:
  contents: write

concurrency:
  group: market-data-runtime-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public compute repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: compute

      - name: Resolve pinned source SHA
        id: source
        shell: bash
        working-directory: compute
        run: |
          set -euo pipefail
          source_sha='${{ inputs.source_sha }}'
          if [[ -z "$source_sha" && -f .github/bootstrap-runtime-activation-v1 ]]; then
            source_sha="$(awk -F': ' '$1 == "source_sha" {print $2}' .github/bootstrap-runtime-activation-v1 | tail -1)"
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid source_sha: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify source token
        env:
          SOURCE_TOKEN: ${{ secrets.MARKET_DATA_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo 'MARKET_DATA_SOURCE_TOKEN is not configured' >&2
            exit 1
          fi

      - name: Checkout pinned stock-dairy source
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-dairy
          token: ${{ secrets.MARKET_DATA_SOURCE_TOKEN }}
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          path: source

      - name: Copy bounded Market Data runtime only
        shell: bash
        run: |
          set -euo pipefail
          cd compute
          mkdir -p scripts schemas config
          for path in \
            scripts/collect_market_data.py \
            scripts/market_data_collection.py \
            scripts/market_data_collectors.py \
            scripts/market_data_store.py \
            scripts/initialize_market_data_baseline.py \
            scripts/rebase_market_data_baseline.py \
            scripts/build_market_data_inventory.py \
            scripts/probe_nasdaq_extended.py \
            config/market-data-collector-access.yaml \
            schemas/market-data-series.schema.json \
            schemas/market-data-capture.schema.json \
            schemas/market-data-stage-snapshot.schema.json; do
            cp "../source/$path" "$path"
          done

      - name: Derive compute-local Store config from pinned source
        shell: python
        run: |
          from pathlib import Path
          import yaml

          source = yaml.safe_load(Path('source/config/market-data-store.yaml').read_text())
          out = {
              'schema_version': 1,
              'contract_version': 1,
              'ownership_authority': 'config/data-plane.yaml',
              'purpose': [
                  'runtime configuration for the public Market Data collector',
                  'persist qualified facts only into the private stock-market-data-store checkout',
              ],
              'principles': {
                  'provider_affine_series': True,
                  'cross_provider_series_splice_forbidden': True,
                  'append_only_series': True,
                  'duplicate_equal_is_noop': True,
                  'duplicate_conflict_is_hard_error': True,
                  'snapshot_immutable': True,
                  'explicit_series_rebase_requires_recovery_archive_and_revision_audit': True,
                  'immutable_daily_series_append_requires_provider_settlement_maturity': True,
              },
              'paths': {
                  'root': 'data/market-data',
                  'daily_series_root': 'data/market-data/series/daily',
                  'session_root': 'data/market-data/sessions',
                  'snapshot_root': 'data/market-data/snapshots',
                  'recovery_root': 'data/market-data/recovery',
                  'collector_state_root': 'data/market-data/collector-state',
              },
              'series': source['series'],
              'session_capture': source['session_capture'],
              'stage_snapshot': source['stage_snapshot'],
              'collector_state': source['collector_state'],
              'collector': source['collector'],
          }
          Path('compute/config/market-data-store.yaml').write_text(
              yaml.safe_dump(out, sort_keys=False, allow_unicode=True), encoding='utf-8'
          )

      - name: Record source provenance
        shell: python
        run: |
          from pathlib import Path
          import json
          payload = {
              'schema_version': 1,
              'source_repository': 'yuatom/stock-dairy',
              'source_sha': '${{ steps.source.outputs.sha }}',
              'copied_scope': 'bounded_market_data_runtime_only',
          }
          Path('compute/config/runtime-source.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )

      - name: Static runtime validation
        working-directory: compute
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/collect_market_data.py \
            scripts/market_data_collection.py \
            scripts/market_data_collectors.py \
            scripts/market_data_store.py \
            scripts/initialize_market_data_baseline.py \
            scripts/rebase_market_data_baseline.py \
            scripts/build_market_data_inventory.py \
            scripts/probe_nasdaq_extended.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          u = json.loads(Path('config/collection-universe.json').read_text())
          assert len(u['daily_series']) == 28
          assert len(u['intraday']) == 17
          c = yaml.safe_load(Path('config/market-data-store.yaml').read_text())
          assert c['paths']['root'] == 'data/market-data'
          assert max(c['series']['analysis_windows_may_read_last_sessions']) == 256
          PY

      - name: Commit runtime bootstrap branch
        working-directory: compute
        run: |
          set -euo pipefail
          branch='migration/runtime-bootstrap'
          git checkout -B "$branch"
          git add -- scripts config schemas
          if git diff --cached --quiet; then
            echo 'Runtime already matches pinned source'
            exit 0
          fi
          git config user.name 'stock-market-data-bootstrap-bot'
          git config user.email 'stock-market-data-bootstrap-bot@users.noreply.github.com'
          git commit -m 'feat: bootstrap standalone market-data runtime'
          git push --force-with-lease origin HEAD:"$branch"
