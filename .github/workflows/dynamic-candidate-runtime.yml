name: Dynamic Candidate Collector Runtime

on:
  workflow_call:
    inputs:
      control_ref:
        description: Immutable dynamic market-data request commit
        required: true
        type: string
      control_branch:
        description: Logical control branch
        required: true
        type: string
    secrets:
      MARKET_DATA_STORE_TOKEN:
        required: true
      TWELVE_DATA_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  # Dynamic candidate writes and core stage collector writes both mutate the same
  # private Store tree, including the derived inventory. A single writer queue
  # prevents the inventory rebase conflict observed on 2026-08-17 Open30.
  group: market-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable control request
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_ref }}
          fetch-depth: 1
          path: control

      - name: Checkout current public compute contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: compute

      - name: Checkout private Market Data Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: main
          fetch-depth: 0
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate immutable request
        id: request
        shell: python
        env:
          CONTROL_REF: ${{ inputs.control_ref }}
          CONTROL_BRANCH: ${{ inputs.control_branch }}
        run: |
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          if os.environ.get('CONTROL_BRANCH') != 'discovery-requests':
              raise SystemExit('dynamic candidate runtime requires discovery-requests control branch')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('CONTROL_REF','')):
              raise SystemExit('control_ref must be an immutable commit SHA')
          request = json.loads(Path('control/requests/dynamic-candidate-request.json').read_text(encoding='utf-8'))
          compute_sha = subprocess.check_output(['git','-C','compute','rev-parse','HEAD'], text=True).strip()
          if request.get('schema_version') != 1:
              raise SystemExit('request schema_version must be 1')
          if request.get('research_repository') != 'yuatom/stock-dairy':
              raise SystemExit('unauthorized research repository')
          stage = request.get('stage')
          purpose = request.get('request_purpose')
          if stage not in {'open_15m','open_30m','open_60m','close'}:
              raise SystemExit('stage must be open_15m, open_30m, open_60m or close')
          if purpose not in {'carryover_validation','opportunity_discovery','personal_membership'}:
              raise SystemExit('invalid request_purpose')
          if stage in {'open_15m','open_60m'} and purpose not in {'carryover_validation','personal_membership'}:
              raise SystemExit(f'{stage} dynamic collection forbids new opportunity discovery')
          transaction_id = request.get('transaction_id')
          if not isinstance(transaction_id, str) or not transaction_id.strip():
              raise SystemExit('transaction_id must be a non-empty string')
          symbols = request.get('candidate_symbols')
          if not isinstance(symbols, list) or not (1 <= len(symbols) <= 8):
              raise SystemExit('candidate_symbols must contain 1-8 symbols')
          if len(set(symbols)) != len(symbols) or any(not re.fullmatch(r'[A-Z][A-Z0-9.-]{0,9}', str(x)) for x in symbols):
              raise SystemExit('invalid candidate_symbols')
          for field in ('research_repository_commit_sha','market_data_contract_sha'):
              if not re.fullmatch(r'[0-9a-f]{40}', str(request.get(field) or '')):
                  raise SystemExit(f'invalid {field}')
          if request.get('research_universe_resolution_status') != 'resolved':
              raise SystemExit('research_universe_resolution_status must be resolved')
          proof = request.get('personal_state_proof')
          if not isinstance(proof, dict):
              raise SystemExit('personal_state_proof must be an object')
          expected_proof_fields = {
              'dynamic_state_read_sha','blob_sha','state_version','authority_state',
              'content_hash_status','content_sha256',
          }
          if set(proof) != expected_proof_fields:
              raise SystemExit('personal_state_proof fields are incomplete or unsupported')
          for field in ('dynamic_state_read_sha','blob_sha'):
              if not re.fullmatch(r'[0-9a-f]{40}', str(proof.get(field) or '')):
                  raise SystemExit(f'personal_state_proof {field} is invalid')
          if not isinstance(proof.get('state_version'), int) or proof['state_version'] < 1:
              raise SystemExit('personal_state_proof state_version is invalid')
          if proof.get('authority_state') not in {'shadow_pre_cutover','canonical'}:
              raise SystemExit('personal_state_proof authority_state is invalid')
          hash_status = proof.get('content_hash_status')
          if hash_status == 'canonical_sha256':
              if not re.fullmatch(r'[0-9a-f]{64}', str(proof.get('content_sha256') or '')):
                  raise SystemExit('canonical personal_state_proof requires content_sha256')
          elif hash_status == 'unavailable_no_script':
              if proof.get('content_sha256') is not None:
                  raise SystemExit('unavailable_no_script requires null content_sha256')
          else:
              raise SystemExit('personal_state_proof content_hash_status is invalid')
          if request.get('market_data_contract_sha') != compute_sha:
              raise SystemExit('request market_data_contract_sha does not match current compute main')
          if str(request.get('trade_date') or '') > datetime.now(ZoneInfo('America/New_York')).date().isoformat():
              raise SystemExit('trade_date cannot be in the future')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f'contract_sha={compute_sha}\n')
          print(json.dumps({'request_id':request.get('request_id'),'stage':stage,'request_purpose':purpose,'candidate_count':len(symbols),'contract_sha':compute_sha}, sort_keys=True))

      - name: Collect qualified dynamic facts
        id: collect
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          python scripts/collect_dynamic_candidates.py \
            --request ../control/requests/dynamic-candidate-request.json \
            --store-root ../store/data/market-data \
            --store-config config/market-data-store.yaml \
            --access-config config/market-data-collector-access.yaml \
            --dynamic-config config/dynamic-candidate-collection.yaml \
            --expected-contract-sha '${{ steps.request.outputs.contract_sha }}' | tee "$result_file"
          manifest_path="$(python - "$result_file" <<'PY'
import json
import sys
from pathlib import Path
lines = [line for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()]
value = json.loads(lines[-1])
manifest = value.get("publication_manifest_path")
if not isinstance(manifest, str) or not manifest:
    raise SystemExit("dynamic collector did not emit publication_manifest_path")
print(manifest)
PY
          )"
          echo "publication_manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Rebuild private Store inventory
        working-directory: compute
        run: >-
          python scripts/build_market_data_inventory.py
          --store-root ../store/data/market-data
          --output ../store/data/market-data/collector-state/market-data-inventory.json
          >/dev/null

      - name: Persist private Store only
        working-directory: store
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/market-data
          if git diff --cached --quiet; then
            echo '{"status":"no_store_change","changed_paths":0}'
            exit 0
          fi
          changed_count="$(git diff --cached --name-only -- data/market-data | wc -l | tr -d ' ')"
          git config user.name 'stock-market-data-bot'
          git config user.email 'stock-market-data-bot@users.noreply.github.com'
          git commit -m 'data: collect dynamic research objects'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "{\"status\":\"store_persisted\",\"changed_paths\":$changed_count,\"store_commit_sha\":\"$(git rev-parse HEAD)\"}"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify durable Store publication
        working-directory: store
        shell: bash
        run: |
          set -euo pipefail
          python ../compute/scripts/verify_store_publication.py \
            --store-root . \
            --expected-commit "$(git rev-parse HEAD)" \
            --writer-status dynamic_candidate_persisted \
            --required-manifest "data/market-data/${{ steps.collect.outputs.publication_manifest_path }}"
