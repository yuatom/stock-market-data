name: Dynamic Candidate Collector Runtime

on:
  workflow_call:
    inputs:
      control_ref:
        description: Immutable dynamic market-data request commit
        required: true
        type: string
      control_branch:
        description: Logical control branch
        required: true
        type: string
    secrets:
      MARKET_DATA_STORE_TOKEN:
        required: true
      TWELVE_DATA_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: dynamic-candidate-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable control request
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_ref }}
          fetch-depth: 1
          path: control

      - name: Checkout current public compute contract
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: compute

      - name: Checkout private Market Data Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: main
          fetch-depth: 0
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate immutable request
        id: request
        shell: python
        env:
          CONTROL_REF: ${{ inputs.control_ref }}
          CONTROL_BRANCH: ${{ inputs.control_branch }}
        run: |
          import json
          import os
          import re
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          if os.environ.get('CONTROL_BRANCH') != 'discovery-requests':
              raise SystemExit('dynamic candidate runtime requires discovery-requests control branch')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get('CONTROL_REF','')):
              raise SystemExit('control_ref must be an immutable commit SHA')
          request = json.loads(Path('control/requests/dynamic-candidate-request.json').read_text(encoding='utf-8'))
          compute_sha = subprocess.check_output(['git','-C','compute','rev-parse','HEAD'], text=True).strip()
          if request.get('schema_version') != 1:
              raise SystemExit('request schema_version must be 1')
          if request.get('research_repository') != 'yuatom/stock-dairy':
              raise SystemExit('unauthorized research repository')
          stage = request.get('stage')
          purpose = request.get('request_purpose')
          if stage not in {'open_15m','open_30m','open_60m','close'}:
              raise SystemExit('stage must be open_15m, open_30m, open_60m or close')
          if purpose not in {'carryover_validation','opportunity_discovery'}:
              raise SystemExit('invalid request_purpose')
          if stage in {'open_15m','open_60m'} and purpose != 'carryover_validation':
              raise SystemExit(f'{stage} dynamic collection is carryover_validation only')
          symbols = request.get('candidate_symbols')
          if not isinstance(symbols, list) or not (1 <= len(symbols) <= 8):
              raise SystemExit('candidate_symbols must contain 1-8 symbols')
          if len(set(symbols)) != len(symbols) or any(not re.fullmatch(r'[A-Z][A-Z0-9.-]{0,9}', str(x)) for x in symbols):
              raise SystemExit('invalid candidate_symbols')
          for field in ('research_repository_commit_sha','market_data_contract_sha'):
              if not re.fullmatch(r'[0-9a-f]{40}', str(request.get(field) or '')):
                  raise SystemExit(f'invalid {field}')
          if request.get('market_data_contract_sha') != compute_sha:
              raise SystemExit('request market_data_contract_sha does not match current compute main')
          if str(request.get('trade_date') or '') > datetime.now(ZoneInfo('America/New_York')).date().isoformat():
              raise SystemExit('trade_date cannot be in the future')
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f'contract_sha={compute_sha}\n')
          print(json.dumps({'request_id':request.get('request_id'),'stage':stage,'request_purpose':purpose,'candidate_count':len(symbols),'contract_sha':compute_sha}, sort_keys=True))

      - name: Collect qualified dynamic facts
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/collect_dynamic_candidates.py \
            --request ../control/requests/dynamic-candidate-request.json \
            --store-root ../store/data/market-data \
            --store-config config/market-data-store.yaml \
            --access-config config/market-data-collector-access.yaml \
            --dynamic-config config/dynamic-candidate-collection.yaml \
            --expected-contract-sha '${{ steps.request.outputs.contract_sha }}'

      - name: Rebuild private Store inventory
        working-directory: compute
        run: >-
          python scripts/build_market_data_inventory.py
          --store-root ../store/data/market-data
          --output ../store/data/market-data/collector-state/market-data-inventory.json
          >/dev/null

      - name: Persist private Store only
        working-directory: store
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/market-data
          if git diff --cached --quiet; then
            echo '{"status":"no_store_change","changed_paths":0}'
            exit 0
          fi
          changed_count="$(git diff --cached --name-only -- data/market-data | wc -l | tr -d ' ')"
          git config user.name 'stock-market-data-bot'
          git config user.email 'stock-market-data-bot@users.noreply.github.com'
          git commit -m 'data: collect dynamic research objects'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "{\"status\":\"store_persisted\",\"changed_paths\":$changed_count,\"store_commit_sha\":\"$(git rev-parse HEAD)\"}"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
