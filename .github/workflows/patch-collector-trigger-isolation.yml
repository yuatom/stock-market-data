name: Patch Collector Trigger Isolation

on:
  push:
    branches: [fix/collector-trigger-isolation]
    paths:
      - .github/collector-trigger-isolation-activation-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch collector trigger boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/market-data-collector.yml')
          text = path.read_text(encoding='utf-8')
          old_trigger = '''  push:\n    branches: [main, collector-requests]\n    paths:\n      - .github/market-data-collector-activation-v1\n      - requests/collector-request.json\n'''
          new_trigger = '''  push:\n    branches: [collector-requests]\n    paths:\n      - requests/collector-request.json\n'''
          if old_trigger not in text:
              raise SystemExit('expected collector push trigger block not found')
          text = text.replace(old_trigger, new_trigger, 1)

          old_main_branch = '''          elif event == 'push' and branch == 'main':\n              path = Path('control/.github/market-data-collector-activation-v1')\n              if not path.exists():\n                  raise SystemExit('main push is missing authorized collector activation marker')\n              values = {}\n              for line in path.read_text(encoding='utf-8').splitlines():\n                  if ': ' in line:\n                      key, value = line.split(': ', 1)\n                      values[key.strip()] = value.strip()\n              mode = values.get('mode', '')\n              trade_date = values.get('trade_date', '')\n              request_id = values.get('request_id', '')\n              if mode not in maintenance_modes:\n                  raise SystemExit(f'unauthorized activation mode: {mode}')\n'''
          if old_main_branch not in text:
              raise SystemExit('expected main-push invocation branch not found')
          text = text.replace(old_main_branch, '', 1)
          path.write_text(text, encoding='utf-8')
      - name: Self-remove patch surfaces
        run: |
          rm -f .github/workflows/patch-collector-trigger-isolation.yml
          rm -f .github/collector-trigger-isolation-activation-v1
      - name: Commit isolated trigger fix
        run: |
          set -euo pipefail
          git config user.name 'stock-market-data-maintenance-bot'
          git config user.email 'stock-market-data-maintenance-bot@users.noreply.github.com'
          git add -A .github
          git commit -m 'fix: isolate collector push traffic from contract main'
          git push origin HEAD:fix/collector-trigger-isolation
