name: Market Data Collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collector mode
        required: true
        default: smoke_readonly
        type: choice
        options:
          - smoke_readonly
          - previous_session_eod
          - daily_baseline_init
          - daily_baseline_rebase
          - daily_symbol_maintenance
          - daily_history_tail_backfill
          - daily_baseline_admission
          - nasdaq_extended_probe
          - premarket
          - open_15m
          - open_30m
          - open_60m
          - close
          - close_retry
          - close_final
          - historical_context_repair
      trade_date:
        description: Optional ET trade/calendar date YYYY-MM-DD
        required: false
        type: string
      execution_date:
        description: Current ET accounting date, required only for daily_history_tail_backfill
        required: false
        type: string
      historical_cutoff:
        description: Inclusive already-mature historical session date, required only for daily_history_tail_backfill
        required: false
        type: string
      dynamic_selection:
        description: Optional JSON proof selecting existing failed dynamic daily histories (guarded modes only)
        required: false
        type: string
      fixed_selection:
        description: Optional exact JSON selector for fixed-universe daily histories, pinned to each Store index blob
        required: false
        type: string
      expected_compute_sha:
        description: Required exact current main SHA for guarded daily maintenance modes
        required: false
        type: string
      expected_store_sha:
        description: Required exact starting private Store SHA for guarded daily maintenance modes
        required: false
        type: string
  schedule:
    - {cron: '5 7 * * 1-5', timezone: America/New_York}
    - {cron: '10 7 * * 1-5', timezone: America/New_York}
    - {cron: '20 7 * * 1-5', timezone: America/New_York}
    - {cron: '40 9 * * 1-5', timezone: America/New_York}
    - {cron: '55 9 * * 1-5', timezone: America/New_York}
    - {cron: '25 10 * * 1-5', timezone: America/New_York}
    - {cron: '6 16 * * 1-5', timezone: America/New_York}
    - {cron: '21 16 * * 1-5', timezone: America/New_York}
    - {cron: '36 16 * * 1-5', timezone: America/New_York}
    - {cron: '45 16 * * 1-5', timezone: America/New_York}
    - {cron: '51 16 * * 1-5', timezone: America/New_York}

permissions:
  contents: read

jobs:
  selector_guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject ignored or mixed explicit target selectors
        env:
          MODE: ${{ inputs.mode }}
          EXECUTION_DATE: ${{ inputs.execution_date }}
          HISTORICAL_CUTOFF: ${{ inputs.historical_cutoff }}
          TRADE_DATE: ${{ inputs.trade_date }}
          DYNAMIC_SELECTION: ${{ inputs.dynamic_selection }}
          FIXED_SELECTION: ${{ inputs.fixed_selection }}
        shell: python
        run: |
          import os
          dynamic = bool(os.environ.get('DYNAMIC_SELECTION'))
          fixed = bool(os.environ.get('FIXED_SELECTION'))
          mode = os.environ.get('MODE', '')
          if dynamic and fixed:
              raise SystemExit('fixed and dynamic selections cannot be combined')
          if mode == 'daily_symbol_maintenance':
              if dynamic or not fixed or os.environ.get('EXECUTION_DATE') or os.environ.get('HISTORICAL_CUTOFF'):
                  raise SystemExit('fixed symbol maintenance requires explicit fixed targets')
          elif mode == 'daily_history_tail_backfill':
              if dynamic or not fixed or os.environ.get('TRADE_DATE') or not os.environ.get('EXECUTION_DATE') or not os.environ.get('HISTORICAL_CUTOFF'):
                  raise SystemExit('historical tail requires explicit fixed targets and separate dates only')
          elif os.environ.get('EXECUTION_DATE') or os.environ.get('HISTORICAL_CUTOFF'):
              raise SystemExit('historical dates cannot be ignored by another mode')
          if (dynamic or fixed) and mode not in ('daily_baseline_admission', 'daily_baseline_rebase', 'daily_history_tail_backfill', 'daily_symbol_maintenance'):
              raise SystemExit('explicit target selection requires a guarded daily baseline mode')

  run:
    if: inputs.mode != 'daily_symbol_maintenance' && inputs.mode != 'daily_history_tail_backfill' && inputs.execution_date == '' && inputs.historical_cutoff == '' && inputs.mode != 'daily_baseline_admission' && inputs.mode != 'daily_baseline_rebase' && (github.event_name != 'workflow_dispatch' || (inputs.dynamic_selection == '' && inputs.fixed_selection == ''))
    uses: ./.github/workflows/market-data-collector-runtime.yml
    with:
      trigger_kind: ${{ github.event_name }}
      schedule: ${{ github.event.schedule || '' }}
      mode: ${{ inputs.mode || '' }}
      trade_date: ${{ inputs.trade_date || '' }}
    secrets: inherit

  admission:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'daily_baseline_admission' && inputs.execution_date == '' && inputs.historical_cutoff == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: market-data-collector
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate manual admission identities before checkout
        env:
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
        shell: python
        run: |
          import os
          import re
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('admission requires main')
          for key in ('EXPECTED_COMPUTE_SHA', 'EXPECTED_STORE_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get(key, '')):
                  raise SystemExit('admission requires exact expected commits')
          if os.environ['EXPECTED_COMPUTE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('admission compute event identity mismatch')

      - name: Checkout exact public admission contract
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_compute_sha }}
          fetch-depth: 1
          path: compute

      - name: Checkout exact private Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: ${{ inputs.expected_store_sha }}
          fetch-depth: 0
          path: store

      - name: Checkout dynamic request authority for explicit target proof
        if: inputs.dynamic_selection != ''
        uses: actions/checkout@v4
        with:
          ref: discovery-requests
          fetch-depth: 0
          path: discovery

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded admission dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Admit daily revisions without rewriting market facts
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
          TRADE_DATE: ${{ inputs.trade_date }}
          DYNAMIC_SELECTION: ${{ inputs.dynamic_selection }}
          FIXED_SELECTION: ${{ inputs.fixed_selection }}
        shell: bash
        run: |
          set -euo pipefail
          selection_args=()
          if [[ -n "$DYNAMIC_SELECTION" ]]; then
            selection_args+=(--dynamic-selection "$DYNAMIC_SELECTION" --discovery-repo ../discovery)
          fi
          if [[ -n "$FIXED_SELECTION" ]]; then
            selection_args+=(--fixed-selection "$FIXED_SELECTION")
          fi
          python scripts/admit_market_data_baseline.py \
            --trade-date "$TRADE_DATE" \
            --compute-sha "$EXPECTED_COMPUTE_SHA" \
            --store-sha "$EXPECTED_STORE_SHA" \
            --store-repo ../store \
            --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${selection_args[@]}"

  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'daily_baseline_rebase' && inputs.execution_date == '' && inputs.historical_cutoff == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: market-data-collector
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate manual recovery identities before checkout
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
        shell: python
        run: |
          import datetime
          import os
          import re
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('recovery requires main')
          for key in ('EXPECTED_COMPUTE_SHA', 'EXPECTED_STORE_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get(key, '')):
                  raise SystemExit('recovery requires exact expected commits')
          if os.environ['EXPECTED_COMPUTE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('recovery compute event identity mismatch')
          try:
              if datetime.date.fromisoformat(os.environ.get('TRADE_DATE', '')).isoformat() != os.environ['TRADE_DATE']:
                  raise ValueError
          except ValueError:
              raise SystemExit('recovery requires an exact YYYY-MM-DD trade date')

      - name: Checkout exact public recovery contract
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_compute_sha }}
          fetch-depth: 1
          path: compute

      - name: Checkout exact private Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: ${{ inputs.expected_store_sha }}
          fetch-depth: 0
          path: store

      - name: Checkout dynamic request authority for explicit target proof
        if: inputs.dynamic_selection != ''
        uses: actions/checkout@v4
        with:
          ref: discovery-requests
          fetch-depth: 0
          path: discovery

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded recovery dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Recover complete daily baseline with guarded publisher
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
          TRADE_DATE: ${{ inputs.trade_date }}
          DYNAMIC_SELECTION: ${{ inputs.dynamic_selection }}
          FIXED_SELECTION: ${{ inputs.fixed_selection }}
        shell: bash
        run: |
          set -euo pipefail
          selection_args=()
          if [[ -n "$DYNAMIC_SELECTION" ]]; then
            selection_args+=(--dynamic-selection "$DYNAMIC_SELECTION" --discovery-repo ../discovery)
          fi
          if [[ -n "$FIXED_SELECTION" ]]; then
            selection_args+=(--fixed-selection "$FIXED_SELECTION")
          fi
          python scripts/recover_market_data_baseline.py \
            --trade-date "$TRADE_DATE" \
            --compute-sha "$EXPECTED_COMPUTE_SHA" \
            --store-sha "$EXPECTED_STORE_SHA" \
            --store-repo ../store \
            --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${selection_args[@]}"

  symbol_maintenance:
    needs: selector_guard
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'daily_symbol_maintenance' && inputs.execution_date == '' && inputs.historical_cutoff == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: market-data-collector
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate manual recovery identities before checkout
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
        shell: python
        run: |
          import datetime
          import os
          import re
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('recovery requires main')
          for key in ('EXPECTED_COMPUTE_SHA', 'EXPECTED_STORE_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get(key, '')):
                  raise SystemExit('recovery requires exact expected commits')
          if os.environ['EXPECTED_COMPUTE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('recovery compute event identity mismatch')
          try:
              if datetime.date.fromisoformat(os.environ.get('TRADE_DATE', '')).isoformat() != os.environ['TRADE_DATE']:
                  raise ValueError
          except ValueError:
              raise SystemExit('recovery requires an exact YYYY-MM-DD trade date')

      - name: Checkout exact public recovery contract
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_compute_sha }}
          fetch-depth: 1
          path: compute

      - name: Checkout exact private Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: ${{ inputs.expected_store_sha }}
          fetch-depth: 0
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded recovery dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Maintain isolated fixed symbols with guarded publisher
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
          TRADE_DATE: ${{ inputs.trade_date }}
          FIXED_SELECTION: ${{ inputs.fixed_selection }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/maintain_fixed_symbols.py \
            --trade-date "$TRADE_DATE" \
            --compute-sha "$EXPECTED_COMPUTE_SHA" \
            --store-sha "$EXPECTED_STORE_SHA" \
            --store-repo ../store \
            --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --fixed-selection "$FIXED_SELECTION"

  historical_tail:
    needs: selector_guard
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'daily_history_tail_backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: market-data-collector
      cancel-in-progress: false
      queue: max
    steps:
      - name: Validate historical append identities before checkout
        env:
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
        shell: python
        run: |
          import os
          import re
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('historical tail requires main')
          for key in ('EXPECTED_COMPUTE_SHA', 'EXPECTED_STORE_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ.get(key, '')):
                  raise SystemExit('historical tail requires exact expected commits')
          if os.environ['EXPECTED_COMPUTE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('historical tail compute event identity mismatch')

      - name: Checkout exact public historical append contract
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_compute_sha }}
          fetch-depth: 1
          path: compute

      - name: Checkout exact private Store
        uses: actions/checkout@v4
        with:
          repository: yuatom/stock-market-data-store
          token: ${{ secrets.MARKET_DATA_STORE_TOKEN }}
          ref: ${{ inputs.expected_store_sha }}
          fetch-depth: 0
          path: store

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded historical append dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Append fully qualified mature historical tail
        working-directory: compute
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EXPECTED_COMPUTE_SHA: ${{ inputs.expected_compute_sha }}
          EXPECTED_STORE_SHA: ${{ inputs.expected_store_sha }}
          EXECUTION_DATE: ${{ inputs.execution_date }}
          HISTORICAL_CUTOFF: ${{ inputs.historical_cutoff }}
          FIXED_SELECTION: ${{ inputs.fixed_selection }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backfill_market_data_tail.py \
            --execution-date "$EXECUTION_DATE" \
            --historical-cutoff "$HISTORICAL_CUTOFF" \
            --compute-sha "$EXPECTED_COMPUTE_SHA" \
            --store-sha "$EXPECTED_STORE_SHA" \
            --store-repo ../store \
            --request-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --fixed-selection "$FIXED_SELECTION"
