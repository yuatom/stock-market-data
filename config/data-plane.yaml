schema_version: 1
contract_version: 11
repository: yuatom/stock-market-data
purpose:
  - own reusable Market Data Plane code, contracts, collection and storage semantics
  - keep GitHub Actions collector/runtime public while persisted third-party market data remains private
  - expose independent commit-pinned data-contract and data-read identities to research consumers
  - keep all production Market Fact acquisition and writes out of the research runtime
  - make qualified Premarket and regular-session facts persisted Data Plane capabilities
  - make cutoff-valid Close supported-baseline context a persisted Data Plane capability rather than a research-time side fetch
  - keep mutable control branches as data-only triggers while execution logic always resolves from current main

boundaries:
  owns:
    - collection_universe
    - qualified_premarket_trade_detail_semantics
    - cutoff_valid_cross_asset_proxy_semantics
    - cutoff_valid_close_sector_context
    - collector_transport_and_parser
    - reusable_market_data_store_semantics
    - daily_series_semantics
    - session_capture_semantics
    - stage_snapshot_semantics
    - recovery_and_explicit_rebase_semantics
    - collector_state_semantics
    - source_probe_semantics
    - market_data_inventory_semantics
    - collector_workflows
    - control_branch_dispatcher_contract
    - cross_repository_collector_request_contract
    - explicit_data_maintenance_request_contract
  must_not_own:
    - persisted_market_fact_commit_history
    - research_watchlist_priority
    - market_research
    - decision_semantics
    - report_projection
    - evidence_authority
    - evaluation_decisions
    - canonical_report_finalization
    - formal_macro_or_breadth_research_semantics

repositories:
  compute_and_contract:
    repository: yuatom/stock-market-data
    required_visibility: public
    branch: main
    actions_role: collector_and_data_maintenance_only
  collector_request_control:
    repository: yuatom/stock-market-data
    branch: collector-requests
    path: requests/collector-request.json
    market_fact_authority: false
    contract_authority: false
  maintenance_request_control:
    repository: yuatom/stock-market-data
    branch: maintenance-requests
    path: requests/market-data-maintenance.json
    market_fact_authority: false
    contract_authority: false
  persisted_data_store:
    repository: yuatom/stock-market-data-store
    required_visibility: private
    branch: main
    data_root: data/market-data
    actions_required: false
  research_consumer:
    repository: yuatom/stock-dairy

security:
  registered_third_party_api_data_public_storage_forbidden: true
  compute_repo_required_actions_secrets:
    - TWELVE_DATA_API_KEY
    - MARKET_DATA_STORE_TOKEN
  market_data_store_token_scope:
    repository: yuatom/stock-market-data-store
    minimum_permission: contents_write
    unrelated_repository_access_forbidden: true
  raw_market_data_in_public_actions_logs_or_artifacts_forbidden: true
  public_workflow_must_not_upload_private_store_artifacts: true
  public_workflow_permissions_default: contents_read

principles:
  market_fact_contract_authority_in_compute_repo: true
  market_fact_payload_authority_in_private_store_repo: true
  research_contract_authority_stays_in_stock_dairy: true
  provider_affine_series: true
  cross_provider_series_splice_forbidden: true
  append_only_normal_operation: true
  explicit_rebase_requires_recovery_archive_and_revision_audit: true
  immutable_daily_append_requires_provider_settlement_maturity: true
  snapshot_immutable: true
  probe_is_not_market_fact: true
  explicit_provider_promotion_does_not_promote_probe_artifacts_into_market_facts: true
  production_premarket_facts_require_fresh_per_invocation_truth_validation: true
  store_presence_does_not_bypass_claim_qualification: true
  public_compute_repo_must_not_commit_third_party_market_payloads: true
  mutable_collector_requests_must_not_advance_compute_main: true
  mutable_control_branch_must_not_execute_branch_local_runtime_logic: true
  one_authoritative_payload_store: true
  market_fact_writes_are_collector_or_explicit_data_maintenance_only: true
  research_runtime_market_fact_write_forbidden: true
  research_runtime_may_request_collector_but_must_not_bypass_it: true
  context_proxy_fact_must_preserve_proxy_semantics: true
  context_proxy_must_not_be_relabelled_as_formal_underlying_metric: true
  sector_terminal_fact_must_be_timestamped_regular_session_context: true
  unsupported_enrichment_must_not_be_fabricated_from_proxy_data: true

workflow_execution:
  runtime_workflow: .github/workflows/market-data-collector-runtime.yml
  runtime_authority_ref: main
  runtime_trigger: workflow_call
  scheduled_and_manual_entrypoint: .github/workflows/market-data-collector.yml
  control_dispatcher_template: config/control-branch-dispatcher.yml
  control_branches: [collector-requests, maintenance-requests]
  control_branch_dispatcher_rules:
    business_logic_forbidden: true
    provider_logic_forbidden: true
    store_write_logic_forbidden: true
    must_call_runtime_at_main: true
    must_pass_immutable_control_ref: true
    must_pass_control_branch_identity: true
    secrets_must_be_inherited_to_main_runtime: true
  rationale:
    - github_push_uses_workflow_definition_from_triggering_branch
    - mutable_control_branch_workflow_drift_must_not_change_runtime_semantics
    - request_payload_is_read_from_immutable_trigger_commit_but compute_and_runtime_logic_are_resolved_from_main

collection_membership:
  owner: config/collection-universe.json
  loader: scripts/collection_universe.py
  research_watchlist_is_not_dependency: true
  premarket_group_is_first_class: true
  live_collector_reads_first_class_universe_directly: true
  baseline_initializer_reads_first_class_universe_directly: true
  explicit_rebase_reads_first_class_universe_directly: true
  close_supported_baseline_maintenance_is_derived_from_collection_groups: true
  live_intraday_universe_must_not_expand_only_for_historical_sector_repair: true
  runtime_compatibility_file_dependency: false
  generated_compatibility_membership_files_forbidden: true

supported_premarket_baseline:
  owner: config/collection-universe.json#premarket
  provider_contract: config/market-data-collector-access.yaml#nasdaq_public_extended_premarket
  target_window_et: {start: '04:00', end: '09:30'}
  required_target_count: 12
  required_core_count: 10
  required_market_anchors: [QQQ, SPY]
  target_trade_date_required: true
  source_timestamp_required: true
  security_identity_required: true
  delayed_semantics_must_be_preserved: true
  exact_realtime_claim_forbidden: true
  per_trade_reported_share_volume_is_not_consolidated_session_volume: true
  no_qualified_symbol_fact_behavior: claim_scoped_missing
  partial_snapshot_is_valid_input_with_missing_symbols: true
  scheduled_warmup_et: '07:20'
  on_demand_request_allowed_before_read_sha_pin: true

supported_close_baseline:
  owner: config/collection-universe.json
  historical_repair_mode: historical_context_repair
  historical_repair_scope: cutoff_valid_close_supported_baseline
  historical_repair_window_et: {start: '15:45', end: '16:00'}
  terminal_groups:
    sector_context: sector_etfs
    cross_asset_context: context_proxies
  required_sector_count: 11
  required_cross_asset_categories: [rates, volatility, dollar, commodities, crypto]
  provider_timestamp_must_match_target_trade_date: true
  target_window_timestamp_required: true
  terminal_market_fact_semantics: timestamped_regular_session_context_provider_specific_not_official_close_or_sip
  daily_series_settlement_must_not_substitute_for_pre_1600_terminal_fact: true
  research_runtime_backfill_forbidden: true

supported_context_baseline:
  role: cutoff_valid_cross_asset_proxy
  owner: config/collection-universe.json#context_proxies
  categories: [rates, volatility, dollar, commodities, crypto]
  collection_session: regular
  historical_repair_mode: historical_context_repair
  historical_repair_window_et: {start: '15:45', end: '16:00'}
  provider_timestamp_must_match_target_trade_date: true
  target_window_timestamp_required: true
  stored_fact_semantics_must_include:
    - category
    - quality_role
    - semantics
    - not_equivalent_to
  interpretation:
    rates: directional_duration_or_rates_proxy_only
    volatility: directional_volatility_risk_proxy_only
    dollar: directional_dollar_proxy_only
    commodities: directional_precious_metals_proxy_only
    crypto: directional_bitcoin_risk_proxy_only
  forbidden_relabelling:
    - official_yield_curve
    - policy_rate
    - spot_vix
    - official_vix_close
    - official_dollar_index
    - spot_gold
    - btc_spot
    - official_consolidated_vwap
    - sip_or_full_market_volume

collector_request_interface:
  repository: yuatom/stock-market-data
  branch: collector-requests
  path: requests/collector-request.json
  schema: schemas/collector-request.schema.json
  runtime_modes: [premarket, open_15m, open_30m, open_60m, close]
  producer: stock_dairy_chatgpt_runtime
  request_must_bind:
    - research_repository_commit_sha
    - market_data_contract_sha
    - trade_date
    - stage
    - request_id
  market_data_contract_sha_must_equal_current_compute_main: true
  current_trade_date_only: true
  request_is_control_state_not_market_fact: true
  control_request_read_ref_must_equal_trigger_commit: true
  collector_compute_checkout_ref: main
  request_branch_content_must_not_be_used_as_compute_code: true
  request_branch_workflow_must_be_thin_dispatcher_only: true

maintenance_request_interface:
  repository: yuatom/stock-market-data
  branch: maintenance-requests
  path: requests/market-data-maintenance.json
  schema: schemas/market-data-maintenance-request.schema.json
  allowed_modes:
    daily_baseline_init: collection_universe_daily_baseline
    historical_context_repair: cutoff_valid_close_supported_baseline
  authority: owner_authorized_data_plane_maintenance
  market_data_contract_sha_must_equal_current_compute_main: true
  future_trade_date_forbidden: true
  request_is_control_state_not_market_fact: true
  control_request_read_ref_must_equal_trigger_commit: true
  collector_compute_checkout_ref: main
  request_branch_content_must_not_be_used_as_compute_code: true
  request_branch_workflow_must_be_thin_dispatcher_only: true
  research_runtime_implicit_historical_repair_forbidden: true

payload_writers:
  scheduled_and_on_demand_collector:
    executor: stock_market_data_github_actions
    allowed_repository: yuatom/stock-market-data-store
    allowed_prefix: data/market-data
    allowed_write_kinds: [daily_series, session_capture, stage_snapshot, collector_state, probe_state, inventory]
  explicit_data_maintenance:
    executor: stock_market_data_github_actions_or_local_recovery
    allowed_repository: yuatom/stock-market-data-store
    allowed_prefix: data/market-data
    explicit_mode_required: true
    recovery_and_revision_audit_required_when_mutating_persisted_history: true
    append_only_context_repair_may_add_new_immutable_capture_and_snapshot_refs: true
  stock_dairy_research_runtime:
    executor: stock_dairy_chatgpt_runtime
    market_fact_write_allowed: false
    allowed_control_write_only: collector_request_interface
  writers_share_storage_semantics_from_this_contract: true
  multiple_semantic_authorities_for_storage_forbidden: true

consumer_interface:
  research_repository: yuatom/stock-dairy
  required_pins:
    research_repository_commit_sha: immutable stock-dairy research-contract commit
    market_data_contract_sha: immutable commit in yuatom/stock-market-data containing active data-plane contract
    market_data_read_sha: immutable commit in yuatom/stock-market-data-store resolved once during research input resolution after optional bounded collector wait
  one_market_data_read_sha_per_frozen_research_input: true
  ref_shape:
    required: [repository, read_sha, path, blob_sha]
  ref_repository_must_equal: yuatom/stock-market-data-store
  market_data_contract_sha_must_not_be_reused_as_market_data_read_sha: true
  market_data_read_sha_must_not_be_reused_as_research_contract_sha: true
  external_consumer_must_requalify_fact_for_claim: true
  legacy_local_store_mixing_in_same_input_forbidden: true
  research_input_freeze_is_consumer_owned_not_data_plane_owned: true
  consumer_must_not_refresh_read_sha_after_research_input_freeze: true
  store_miss_may_trigger_collector_request: true
  store_miss_must_not_authorize_research_runtime_market_fetch_or_write: true
  premarket_refs_are_first_class_market_data_refs: true
  cutoff_valid_context_proxy_refs_are_first_class_market_data_refs: true
  proxy_semantics_must_survive_into_frozen_research_input: true

migration:
  source_repository: yuatom/stock-dairy
  source_root: sources/market-data
  target_repository: yuatom/stock-market-data-store
  target_root: data/market-data
  initial_mirror_source_ref: b8814f501588adfecde3a63b02b32b5e5f27959f
  initial_private_store_commit: b29b0bd13f1bf5a2f1586ffba3315e385e3373d9
  initial_mirror_file_count: 261
  initial_mirror_total_bytes: 1694709
  initial_mirror_payload_tree_sha256: 384e2c726d617e8b0145c2f087d9930249c88b38a76c85ef581881362516ef0
  smoke_evidence:
    private_store_readonly_run_id: 31905104622
    provider_noop_run_id: 31905129892
    provider_noop_symbols_requested: 28
    provider_noop_changed_series: 0
    provider_noop_failure_count: 0
    provider_noop_result: ok
    private_store_post_smoke_commit: 0db695f7d4aed10634a02ed00bbe5c63bf42cff3
    conclusion: provider_and_private_store_execution_path_verified_without_market_series_revision
  state: consumer_cutover_complete
  consumer_cutover: complete
  source_collector_must_remain_authoritative_until_external_smoke_and_consumer_cutover: true
  dual_authoritative_collectors_for_same_logical_store_forbidden: true
