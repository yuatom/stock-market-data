schema_version: 1
mode: daily_baseline_admission
ownership_authority: config/data-plane.yaml
baseline_authority: config/market-data-store.yaml
universe_authority: config/collection-universe.json
provider_authority: config/market-data-collector-access.yaml
entrypoint: .github/workflows/market-data-collector.yml
job: admission
manual_only: true
current_et_date_only: true
mature_input_required: true
expected_compute_and_store_sha_required: true
concurrency_group: market-data-collector
market_facts_read_only: true
durable_predebit_required: true
budget_source: collector.budgets.twelve_data_basic
budget_debit_before_provider_request: true
budget_refund_on_failed_or_unused_request: false
budget_minute_expiry_behavior: stop_without_request_keep_debit
single_provider_request_per_symbol: true
provider_retry: false
allowed_writes:
  - data/market-data/collector-state/{YYYY-MM}/{trade_date}-twelve-data-budget.json
  - data/market-data/collector-state/{YYYY-MM}/{trade_date}-daily-baseline-admission-{run_id}-{run_attempt}.json
forbidden_write_surfaces: [series, sessions, snapshots, recovery, inventory]
required_output: invocation_specific_private_diagnostic
public_output: fixed_status_counts_reason_codes_and_exact_refs_only
private_output: bounded_revision_differences_and_record_hashes
terminal_statuses: [PASS, FAIL, BLOCKED]
interrupted_status: IN_PROGRESS
non_pass_exit_code: 2
admission_is_recovery_or_future_write_authorization: false
pre_provider_guard:
  after_durable_predebit: true
  boundary: strict_replacement_reader_before_http
  current_compute_main_and_clean_checkout_required: true
  current_store_commit_and_unchanged_budget_blob_required: true
  minute_authority: actual_persisted_ledger_delta
  clock_checked_after_remote_identity_reads: true
required_output_closure:
  authority: config/store-publication-durability.yaml
  manifest_carrier: existing_target_day_budget_json
  preserve_credit_and_minute_counters: true
  publish_diagnostic_and_declaration_together: true
  verifier_requires_manifest: true
  verified_outputs_must_equal_exact_diagnostic_path_and_blob: true
  invocation_date_stage_and_diagnostic_identity_must_match: true
