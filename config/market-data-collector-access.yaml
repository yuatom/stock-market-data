schema_version: 1
contract_version: 10
ownership_authority: config/contract-ownership.yaml
source_identity_authority: sources/registry.yaml
store_authority: config/market-data-store.yaml

purpose:
  - own endpoint transport parser retry timeout and bounded-concurrency semantics for the GitHub Actions market-data collector only
  - own non-authoritative transport probe candidates before any new source contract is promoted
  - keep ChatGPT runtime transport authority in config/market-data-access.yaml
  - keep provider identity in sources/registry.yaml and store/reuse semantics in config/market-data-store.yaml
  - make successful-http empty intraday responses diagnosable rather than silent missing
  - provide a free structured regular-session fallback when Nasdaq does not yield target-window facts
  - persist qualified Nasdaq Premarket trade facts after explicit owner promotion without weakening per-fact truth gates

principles:
  execution_plane: github_actions_market_data_collector
  chatgpt_runtime_transport_not_redefined_here: true
  provider_selection_for_report_research_forbidden: true
  report_research_forbidden: true
  report_projection_forbidden: true
  report_finalization_forbidden: true
  only_qualified_facts_may_reach_store: true
  session_and_timestamp_truthfulness_required: true
  probe_result_is_not_market_fact: true
  probe_result_must_not_create_source_capability: true
  readiness_result_is_not_market_fact: true
  readiness_result_must_not_auto_promote_source_capability: true
  explicit_owner_promotion_may_register_a_production_contract_without_reclassifying_probe_bytes_as_market_facts: true
  every_production_premarket_fetch_must_revalidate_truth_independently: true
  cross_provider_bar_splice_for_same_symbol_window_forbidden: true

http:
  timeout_seconds: 20
  user_agent: Mozilla/5.0 stock-dairy-market-data-collector/1

regular_intraday_collection:
  provider_order: [nasdaq_public_intraday, twelve_data_basic]
  first_qualified_provider_per_symbol_wins: true
  fallback_when_primary_has_no_qualified_target_window_facts: true
  report_runtime_direct_twelve_data_transport_forbidden: true

nasdaq_public_intraday:
  provider_identity: nasdaq_public_intraday
  regular_session_endpoint_template: https://api.nasdaq.com/api/quote/{symbol}/chart?assetclass={asset_class}&charttype=rs
  source_contract: nasdaq_public_chart_last_sale_volume_v1
  chart_array: data.chart
  timestamp_field: x
  timestamp_unit_detection:
    seconds_upper_bound: 10000000000
    milliseconds_divisor: 1000
  last_sale_price_field: y
  reported_minute_volume_field: w
  allowed_sessions: [regular]
  max_workers: 4
  one_symbol_failure_scope: symbol_only
  zero_qualified_increment_snapshot_forbidden: true
  delayed_or_reference_semantics_must_be_preserved: true
  http_success_with_zero_qualified_rows_must_record:
    - raw_row_count
    - timestamp_parseable_count
    - trade_date_match_count
    - target_window_match_count
    - sample_raw_timestamp
    - detected_timestamp_units
  prohibited_uses: [official_close, official_vwap, true_minute_ohlc, consolidated_full_market_volume, realtime_claim_without_provider_semantics]

nasdaq_public_extended_premarket:
  provider_identity: nasdaq_public_extended
  role: production_premarket_trade_detail
  source_contract: nasdaq_public_extended_trade_detail_v1
  endpoint_id: extended_trading_pre
  url_template: https://api.nasdaq.com/api/quote/{symbol}/extended-trading?assetclass={asset_class}&markettype=pre
  allowed_sessions: [premarket]
  target_window_et: ['04:00', '09:30']
  collection_group: config/collection-universe.json#premarket
  feed_scope: official_website_delayed_extended_trade_detail
  formal_primary_feed: false
  exact_realtime_claim_forbidden: true
  required_fact_fields: [symbol, asset_class, session, event_time, source_timestamp, last_sale, reported_share_volume, observed_delay_seconds, security_identity, source_contract]
  qualification:
    application_rCode_must_equal: 200
    explicit_last_update_et_required: true
    target_trade_date_required: true
    every_trade_clock_must_be_inside_target_session: true
    requested_symbol_and_asset_class_must_match_fact_identity: true
    security_identity_must_be_bound_from_collection_universe: true
    ticker_effective_at_must_be_preserved_when_present: true
    delayed_semantics_must_be_preserved: true
    zero_qualified_trade_rows_for_symbol_is_missing_not_success: true
  prohibited_uses:
    - regular_session_quote
    - official_or_consolidated_premarket_volume
    - official_vwap
    - sip_or_full_market_volume
    - exact_realtime_claim
    - after_hours_quote
  promotion_record:
    authority: explicit_owner_contract_change
    evidence_trade_date: '2026-08-17'
    evidence_probe_path: data/market-data/collector-state/probes/nasdaq-extended/2026-08/2026-08-17/074452-et.json
    evidence_required_targets: 12
    evidence_full_target_coverage: true
    evidence_single_trade_date: true
    evidence_stable_response_shape: true
    shadow_minimum_distinct_sessions_remains_observability_not_per_fact_truth_gate: true
    probe_bytes_must_not_be_consumed_directly_as_market_facts: true
    production_runtime_revalidation_required: true

nasdaq_extended_hours_probe:
  provider_identity_candidate: nasdaq_public_intraday
  role: shadow_transport_probe_only
  market_fact_write_forbidden: true
  allowed_write_prefix: data/market-data/collector-state/probes/nasdaq-extended
  readiness_evaluator: scripts/evaluate_nasdaq_extended_probe.py
  readiness_state_path: data/market-data/collector-state/probes/nasdaq-extended/promotion-readiness.json
  readiness_market_fact_authority: false
  readiness_automatic_promotion_allowed: false
  probe_targets:
    - {symbol: TME, asset_class: stocks}
    - {symbol: PLTR, asset_class: stocks}
    - {symbol: SPCX, asset_class: stocks}
    - {symbol: NVDA, asset_class: stocks}
    - {symbol: TSLA, asset_class: stocks}
    - {symbol: MU, asset_class: stocks}
    - {symbol: META, asset_class: stocks}
    - {symbol: ORCL, asset_class: stocks}
    - {symbol: TSM, asset_class: stocks}
    - {symbol: AMD, asset_class: stocks}
    - {symbol: QQQ, asset_class: etf}
    - {symbol: SPY, asset_class: etf}
  candidate_endpoints:
    premarket:
      - id: extended_trading_pre
        url_template: https://api.nasdaq.com/api/quote/{symbol}/extended-trading?assetclass={asset_class}&markettype=pre
    after_hours:
      - id: extended_trading_post
        url_template: https://api.nasdaq.com/api/quote/{symbol}/extended-trading?assetclass={asset_class}&markettype=post
  response_success:
    http_status: 200
    json_object_required: true
    application_status_path: status.rCode
    application_status_success_value: 200
    http_200_with_non_200_application_status_is_failure: true
  capture_probe_fields:
    - asset_class
    - http_status
    - content_type
    - response_length
    - json_top_level_keys
    - response_status_object
    - application_status_code
    - application_status_success
    - application_error_messages
    - data_top_level_keys
    - session_text
    - last_update_info
    - last_update_timestamp_et
    - filter_list
    - info_table_row_count
    - info_table_first_row_keys
    - info_table_first_row
    - trade_detail_row_count
    - trade_detail_first_row_keys
    - trade_detail_first_row
    - trade_detail_last_row
    - trade_detail_time_parseable_count
    - trade_detail_time_unparseable_count
    - trade_detail_earliest_time_et
    - trade_detail_latest_time_et
    - trade_detail_session_window_match_count
    - trade_detail_all_rows_in_candidate_session_window
    - trade_date_candidate
    - trade_date_resolution_basis
    - trade_date_resolvable_without_hindsight
    - latest_trade_lag_seconds_vs_last_update
    - previous_info
    - error_class
    - error_detail
  promotion_gate:
    minimum_distinct_trade_sessions: 3
    required_core_stock_targets: [TME, PLTR, SPCX, NVDA, TSLA, MU, META, ORCL, TSM, AMD]
    required_market_anchor_targets: [QQQ, SPY]
    required_for_premarket:
      - repeated_http_200_json_and_application_rCode_200
      - stable_response_shape
      - explicit_session_text_or_equivalent
      - explicit_trade_row_time_semantics
      - target_trade_date_resolvable_without_hindsight
      - security_identity_preserved
      - delayed_semantics_preserved
    required_for_after_hours:
      - repeated_http_200_json_and_application_rCode_200
      - stable_response_shape
      - explicit_session_text_or_equivalent
      - explicit_trade_row_time_semantics
      - timestamp_after_regular_close_resolvable
      - target_trade_date_resolvable_without_hindsight
      - security_identity_preserved
      - delayed_semantics_preserved
    automatic_promotion_forbidden: true
    report_route_registration_requires_explicit_contract_change: true

twelve_data_basic:
  provider_identity: twelve_data_basic
  base_url: https://api.twelvedata.com
  time_series_path: /time_series
  api_key_env: TWELVE_DATA_API_KEY
  interval_daily: 1day
  interval_intraday: 1min
  intraday_timezone: America/New_York
  intraday_prepost: false
  intraday_outputsize: 90
  allowed_collector_uses:
    - previous_session_daily_ohlcv_reconciliation
    - provider_affine_daily_history_bootstrap
    - provider_affine_daily_gap_repair
    - regular_session_intraday_fallback
  intraday_semantics:
    datetime_is_bar_open_time_in_exchange_timezone: true
    feed_scope: twelve_data_basic_us_equities_limited_realtime_coverage
    regular_session_only: true
    not_consolidated_sip: true
    consolidated_full_market_volume_claim_forbidden: true
    official_vwap_claim_forbidden: true
  returned_history_overlap_must_be_compared_with_persisted_rows: true
  historical_revision_must_not_silently_overwrite: true
  live_premarket_forbidden: true
  live_after_hours_forbidden: true
  automatic_paid_upgrade_forbidden: true
