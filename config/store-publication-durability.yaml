schema_version: 1
contract_version: 7
owner: yuatom/stock-market-data
persisted_store: yuatom/stock-market-data-store
store_retention_authority: yuatom/stock-market-data-store#README.md-consumer-visible-commit-retention
publication_helper: scripts/verify_store_publication.py

purpose:
  - make a successful Store push insufficient by itself for consumer pin authority
  - prove the pushed commit is remotely readable before collector terminal success
  - anchor every consumer-visible Store commit with a deterministic durable ref
  - give stock-dairy an independently verifiable retention proof before market_data_read_sha pin

writer_scope:
  workflows:
    - .github/workflows/market-data-collector-runtime.yml
    - .github/workflows/dynamic-candidate-runtime.yml
    - .github/workflows/extended-hours-readiness.yml
  guarded_manual_wrappers:
    .github/workflows/one-shot-soxx-basis-gap.yml:
      job: soxx_gap
      entrypoint: scripts/run_one_shot_soxx_basis_gap.py
      publication_helper: scripts/daily_basis_remote.py
      finite_single_slot_only: true
      provider_request_limit: 1
      credit_limit: 1
      private_verification_limit: 1
    .github/workflows/retained-soxx-initial-admission.yml:
      job: admit_retained
      entrypoint: scripts/admit_retained_soxx_basis.py
      publication_helper: scripts/daily_basis_remote.py#RemoteGitStore
      exact_fixed_base_required: true
      provider_requests: 0
      legacy_price_changes: 0
      source_diagnostic_manifest: exact_five_new_objects_with_blob_and_sha256
      publication_protocol: direct_child_main_CAS_and_atomic_exact_retention_tag
      receipt_protocol: create_only_private_ref_and_atomic_exact_retention_tag
      receipt_schema: scripts/provider_basis_snapshot.py#basis_consumer_receipt
      receipt_commit_changes: single_addition_basis_authority_receipt_json
      raw_nonce_in_public_output_forbidden: true
      unknown_outcome: stop_inspect_no_retry
      historical_price_only_last_trade_date: '2026-11-11'
      current_report_calendar_gate_unchanged: true
    .github/workflows/retained-xlc-high-correction.yml:
      job: quarantine
      entrypoint: scripts/apply_retained_xlc_price_candidate.py
      publication_helper: scripts/verify_store_publication.py
      separate_request_specific_output_manifest: true
      exact_fixed_base_required: true
      provider_requests: 0
      owner_scoped_high_correction_only: true
    .github/workflows/retained-xlc-volume-quarantine.yml:
      job: quarantine
      entrypoint: scripts/quarantine_retained_xlc_volume.py
      publication_helper: scripts/verify_store_publication.py
      separate_request_specific_output_manifest: true
      exact_fixed_base_required: true
      provider_requests: 0
      price_changes: 0
    .github/workflows/reconcile-retained-daily.yml:
      job: reconcile
      entrypoint: scripts/reconcile_retained_daily.py
      publication_helper: scripts/verify_store_publication.py
      separate_request_specific_output_manifest: true
      base_advance_policy: nov10_close_artifacts_only_v1
      exact_actual_base_rechecked_before_single_push: true
    .github/workflows/retained-soxx-web-price-appendix.yml:
      job: publish_exact_appendix
      entrypoint: scripts/publish_soxx_web_appendix.py
      publication_helper: scripts/verify_store_publication.py
      protected_environment: soxx-web-appendix-exact
      authorization: independently_bound_exact_compute_source_workflow_run_and_store_candidate
      expected_repository: yuatom/stock-market-data-store
      private_runtime_profile_required: true
      independent_run_authority_binds_profile_sha256: true
      store_base_advance: v1_exact_private_premarket_or_v2_exact_ordered_premarket_then_early_close
      store_base_advance_purpose: previously_verified_retained_store_drift_only
      store_base_advance_never_grants_producer_or_complete_minute_admission: true
      publication_logs: generic_status_only
      exact_four_additions_required: true
      branch_update: github_graphql_createCommitOnBranch_expectedHeadOid_single_post
      store_publication_commit_independently_verified_parent_and_tree: true
      provider_requests: 0
      volume_writes: 0
      native_receipt_issued: false
      activation_scope: separately_admitted_prior_close_only
      unknown_outcome: stop_inspect_no_retry
  all_store_writers_must_share_concurrency_group: market-data-collector
  terminal_success_for_new_or_existing_store_head_requires_durability_pass: true

existing_publication_reuse:
  scope: original_16_06_scheduled_base_on_independently_confirmed_early_close_only
  read_only_helper: scripts/close_publication_reuse.py
  same_session_and_pinned_compute_proof_required: true
  complete_single_provider_window_for_each_live_close_symbol_required: true
  required_manifest_verified_at_its_producing_commit: true
  exact_existing_retention_for_producer_and_current_store_required: true
  existing_commit_must_still_equal_remote_main: true
  no_provider_requests_budget_debits_new_tags_or_store_writes_when_reused: true
  confirmed_manifest_or_retention_absence_incomplete_coverage_or_other_compute_proof: original_scheduled_collector
  ambiguous_integrity_or_unreadable_proof: fail_closed
  terminal_status: reused_existing_qualified_close
  terminal_status_is_not_a_new_durability_receipt: true

remote_publication_proof:
  order:
    - payload_or_control_state_commit_complete
    - push_to_store_main_accepted
    - read_exact_remote_main_ref_without_using_local_tracking_state
    - require_remote_main_equals_pushed_commit_while_writer_lock_is_held
    - fetch_same_verified_immutable_commit_without_reresolving_floating_main
    - require_fetched_commit_equals_expected_commit
    - recheck_local_head_and_remote_main_before_output_verification
    - require_remote_commit_object_readable
    - verify_changed_non_deleted_path_blob_ids_from_remote_commit
    - read_required_output_manifest_at_remote_commit_when_present
    - verify_every_declared_required_output_path_and_blob
    - create_or_verify_deterministic_durable_ref
    - exact_readback_durable_ref
    - emit_durability_receipt
  remote_main_mismatch: fail_closed
  remote_commit_unreadable: fail_closed
  fetched_commit_mismatch: fail_closed
  remote_path_blob_mismatch: fail_closed
  required_output_missing_or_unreadable: fail_closed

required_output_closure:
  manifest_scope: data/market-data/collector-state
  manifest_schema_version: 1
  required_fields: [schema_version, request_id, trade_date, stage, required_outputs]
  required_output_path_is_relative_to_data_market_data_root: true
  required_output_paths_must_be_unique: true
  required_output_fields: [path, blob_sha]
  every_required_path_must_exist_at_store_commit_sha: true
  every_required_blob_sha_must_equal_remote_commit_blob: true
  producer_terminal_success_requires_closure: true
  dynamic_candidate_snapshot_when_written_must_be_declared: true
  dynamic_candidate_result_state_must_be_declared: true

retention_anchor:
  ref_template: refs/tags/market-data-read/{store_commit_sha}
  target_must_equal_store_commit_sha: true
  create_only_or_exact_existing_same_target: true
  retarget_forbidden: true
  deletion_forbidden: true
  normal_history_rewrite_that_orphans_exposed_commit_forbidden: true
  tag_push_failure: bounded_exact_ref_reconciliation_else_fail_closed
  tag_readback_failure: fail_closed

durability_receipt:
  output_medium: workflow_stdout_safe_json
  required_fields:
    - status
    - store_commit_sha
    - durability_ref
    - remote_main_sha
    - verified_changed_paths
    - verified_required_outputs
  status_value: durability_verified
  private_payload_values_in_public_log_forbidden: true

consumer_contract:
  consumer: yuatom/stock-dairy
  candidate_sha_source: store_main_resolved_after_optional_bounded_collector_wait
  deterministic_ref_derived_from_candidate_sha: true
  consumer_must_independently_exact_read_ref: true
  consumer_must_require_ref_target_equals_candidate_sha: true
  consumer_must_exact_read_commit_and_consumed_path_blob_ids: true
  proof_required_before_market_data_read_sha_pin: true
  producer_terminal_success_without_proof_is_not_pin_authority: true
  producer_terminal_success_requires_required_output_closure: true
  proof_failure_must_not_substitute_newer_store_main: true

verification_transport:
  scope: publication_helper_remote_fetch_ref_read_and_retention_tag_only
  max_attempts_per_operation: 3
  command_timeout_seconds: 30
  shared_elapsed_budget_seconds: 120
  backoff_seconds: [1, 3]
  classifier: scripts/push_proof_store_commit.py#transient
  only_identified_transient_errors_retryable: true
  permanent_or_unknown_error: fail_closed
  exhausted_or_unreadable_result: fail_closed
  failed_fetch_must_not_use_stale_fetch_head: true
  tag_write_requires_fresh_exact_main_and_tag_absence: true
  tag_retry_must_keep_same_expected_commit_and_ref: true
  lost_tag_ack_requires_exact_ref_readback: true
  remote_main_and_local_head_rechecked_before_success: true
  forced_update_retarget_delete_or_proof_rebuild: forbidden
  raw_transport_stderr_and_credential_urls_in_errors: forbidden
  no_change_to_provider_facts_receipt_schema_or_consumer_pin_rules: true
